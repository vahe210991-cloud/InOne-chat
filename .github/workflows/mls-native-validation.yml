name: Native MLS client validation
# This workflow is part of the synchronized exact-HEAD CI gate for this PR.

# This workflow validates the persistent MLS bridge and client on the exact PR branch head.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "inone-engine-poc-0.6.0/mobile-mls/**"
      - "inone-development-archive-0.6.0/engine/mobile-mls/**"
      - "mobile/rust/**"
      - ".github/workflows/mls-native-validation.yml"
  push:
    branches: [main]
    paths:
      - "inone-engine-poc-0.6.0/mobile-mls/**"
      - "inone-development-archive-0.6.0/engine/mobile-mls/**"
      - "mobile/rust/**"
      - ".github/workflows/mls-native-validation.yml"

permissions:
  contents: write

concurrency:
  group: native-mls-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  INONE_ENGINE_DIR: ${{ github.workspace }}/inone-development-archive-0.6.0/engine

jobs:
  prepare:
    name: Format MLS Rust and regenerate locked dependencies
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: rustfmt
      - name: Format both MLS Rust crates
        run: |
          set -euo pipefail
          cargo fmt --manifest-path inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.toml
          cargo fmt --manifest-path mobile/rust/Cargo.toml
      - name: Regenerate committed lockfiles
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.toml
          cargo generate-lockfile --manifest-path mobile/rust/Cargo.toml
      - name: Verify lockfiles and run Rust checks
        run: |
          set -euo pipefail
          cargo fmt --manifest-path inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.toml -- --check
          cargo fmt --manifest-path mobile/rust/Cargo.toml -- --check
          cargo check --locked --all-targets --manifest-path inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.toml
          cargo test --locked --no-fail-fast --manifest-path inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.toml -- --test-threads=1
          cargo check --locked --all-targets --manifest-path mobile/rust/Cargo.toml
          cargo test --locked --no-fail-fast --manifest-path mobile/rust/Cargo.toml
      - name: Commit formatting and lockfile updates
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add inone-development-archive-0.6.0/engine/mobile-mls/mls-client mobile/rust
            git commit -m "fix(ci): format MLS Rust and refresh Cargo lockfiles"
            git push origin "HEAD:${HEAD_REF}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  mls-client:
    needs: prepare
    name: OpenMLS attachment and session integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Validated source SHA: $actual"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inone-development-archive-0.6.0/engine/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: rustfmt
      - name: Install canonical engine dependencies for real-server integration tests
        run: npm ci
        working-directory: inone-development-archive-0.6.0/engine
      - name: Verify committed MLS client lockfile
        run: test -s inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.lock
      - name: Check every MLS client target
        run: cargo check --locked --all-targets --manifest-path inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.toml
      - name: Run MLS client unit and canonical-engine integration tests
        run: cargo test --locked --no-fail-fast --manifest-path inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.toml -- --test-threads=1


  canonical-mls-client:
    needs: prepare
    name: Canonical B MLS client regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Validated canonical B source SHA: $actual"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inone-development-archive-0.6.0/engine/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: rustfmt
      - name: Install canonical engine dependencies for real-server integration tests
        run: npm ci
        working-directory: inone-development-archive-0.6.0/engine
      - name: Verify canonical B lockfile
        run: test -s inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.lock
      - name: Verify canonical B Rust formatting
        run: cargo fmt --manifest-path inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.toml -- --check
      - name: Check every canonical B MLS client target
        run: cargo check --locked --all-targets --manifest-path inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.toml
      - name: Run canonical B P1 MLS regression tests
        run: cargo test --locked --no-fail-fast --manifest-path inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.toml -- --test-threads=1

  ios-keychain:
    needs: prepare
    name: iOS Keychain native target build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Validated source SHA: $actual"
      - name: Detect persistent bridge crate
        id: bridge
        run: |
          if [ -f mobile/rust/Cargo.toml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.bridge.outputs.available == 'true'
        with:
          toolchain: "1.91.0"
          targets: "aarch64-apple-ios"
      - name: Verify committed iOS bridge lockfile
        if: steps.bridge.outputs.available == 'true'
        run: test -s mobile/rust/Cargo.lock
      - name: Build iOS Keychain bridge target
        if: steps.bridge.outputs.available == 'true'
        run: cargo build --locked --target aarch64-apple-ios --manifest-path mobile/rust/Cargo.toml

  rust-bridge:
    needs: prepare
    name: Persistent Flutter Rust bridge host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Validated source SHA: $actual"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: rustfmt
      - name: Detect whether the persistent bridge crate exists on this branch
        id: bridge
        run: |
          if [ -f mobile/rust/Cargo.toml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify committed bridge lockfile
        if: steps.bridge.outputs.available == 'true'
        run: test -s mobile/rust/Cargo.lock
      - name: Verify bridge formatting
        if: steps.bridge.outputs.available == 'true'
        run: cargo fmt --manifest-path mobile/rust/Cargo.toml -- --check
      - name: Check bridge crate
        if: steps.bridge.outputs.available == 'true'
        run: cargo check --locked --all-targets --manifest-path mobile/rust/Cargo.toml
      - name: Run bridge lifecycle and persistence tests
        if: steps.bridge.outputs.available == 'true'
        run: cargo test --locked --no-fail-fast --manifest-path mobile/rust/Cargo.toml
