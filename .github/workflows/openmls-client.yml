name: OpenMLS client validation

on:
  workflow_dispatch:
  push:
    branches: [main, feature/stage-4-native-mls-runtime-2026-11-11]
    paths:
      - ".github/workflows/openmls-client.yml"
      - "inone-engine-poc-0.6.0/mobile-mls/mls-client/**"
      - "inone-engine-poc-0.6.0/src/**"
      - "inone-engine-poc-0.6.0/package.json"
      - "inone-development-archive-0.6.0/engine/package.json"
      - "inone-development-archive-0.6.0/engine/package-lock.json"
      - "inone-development-archive-0.6.0/engine/src/**"

permissions:
  contents: read

concurrency:
  group: openmls-client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openmls-client:
    name: Rust client + real engine integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INONE_ENGINE_DIR: ${{ github.workspace }}/inone-development-archive-0.6.0/engine
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.7.0"
          cache: npm
          cache-dependency-path: inone-development-archive-0.6.0/engine/package-lock.json

      - name: Install engine dependencies
        run: npm ci --prefix inone-development-archive-0.6.0/engine

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            inone-engine-poc-0.6.0/mobile-mls/mls-client -> target

      - name: Test persistent OpenMLS client
        run: cargo test --locked --manifest-path inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.toml -- --test-threads=1
