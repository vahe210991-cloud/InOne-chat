name: OpenMLS 0.9.2 SQLCipher compatibility prototype

on:
  push:
    branches:
      - security/prototype/openmls-092-sqlcipher-compat-2026-11-26
      - security/prototype-openmls-092-sqlcipher-compat-2026-11-26
  pull_request:
    branches:
      - security/beta1-stage5-supply-chain-main-2026-11-25
    paths:
      - "development/prototypes/openmls-0.9.2-sqlcipher-compat/**"
      - ".github/workflows/openmls-092-sqlcipher-compat-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openmls-092-compat-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: OpenMLS 0.8.1 legacy database read by stable 0.9.2
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.94.0"
          components: rustfmt

      - name: Check formatting
        run: |
          cargo fmt --manifest-path development/prototypes/openmls-0.9.2-sqlcipher-compat/legacy-writer/Cargo.toml -- --check
          cargo fmt --manifest-path development/prototypes/openmls-0.9.2-sqlcipher-compat/current-reader/Cargo.toml -- --check

      - name: Generate OpenMLS 0.8.1 SQLCipher database and read with stable 0.9.2
        run: bash development/prototypes/openmls-0.9.2-sqlcipher-compat/scripts/run.sh

      - name: Install pinned RustSec CLI
        run: cargo install --locked --version 0.23.0 cargo-audit

      - name: Audit the stable candidate lockfile with retained JSON report
        id: rustsec_audit
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/rustsec"
          cargo audit --file development/prototypes/openmls-0.9.2-sqlcipher-compat/current-reader/Cargo.lock --json > "$RUNNER_TEMP/rustsec/openmls-092-candidate.json"

      - name: Upload candidate lockfile and RustSec evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openmls-092-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            development/prototypes/openmls-0.9.2-sqlcipher-compat/current-reader/Cargo.lock
            development/prototypes/openmls-0.9.2-sqlcipher-compat/legacy-writer/src/main.rs
            development/prototypes/openmls-0.9.2-sqlcipher-compat/current-reader/src/lib.rs
            ${{ runner.temp }}/rustsec/openmls-092-candidate.json
          if-no-files-found: warn
          retention-days: 14

      - name: Keep RustSec findings blocking after preserving evidence
        if: steps.rustsec_audit.outcome == 'failure'
        run: |
          echo "::error::Stable candidate RustSec audit found advisories; generated lockfile and evidence were preserved."
          exit 1
