name: Rust lockfile refresh evidence (temporary)

on:
  push:
    branches:
      - "security/prototype/openmls-092-sqlcipher-compat-2026-11-26"
    paths:
      - "inone-development-archive-0.6.0/engine/mobile-mls/**"
      - "inone-engine-poc-0.6.0/mobile-mls/**"
      - "mobile/rust/Cargo.toml"

permissions:
  contents: read

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.94"
      - name: Resolve all committed Rust lockfiles from the upgraded manifests
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.toml
          cargo generate-lockfile --manifest-path inone-development-archive-0.6.0/engine/mobile-mls/mls-bridge/Cargo.toml
          cargo generate-lockfile --manifest-path inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.toml
          cargo generate-lockfile --manifest-path inone-engine-poc-0.6.0/mobile-mls/mls-bridge/Cargo.toml
          cargo generate-lockfile --manifest-path mobile/rust/Cargo.toml
          mkdir -p "${RUNNER_TEMP}/refreshed-lockfiles"
          cp inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.lock "${RUNNER_TEMP}/refreshed-lockfiles/engine-a-mls-client.Cargo.lock"
          cp inone-development-archive-0.6.0/engine/mobile-mls/mls-bridge/Cargo.lock "${RUNNER_TEMP}/refreshed-lockfiles/engine-a-mls-bridge.Cargo.lock"
          cp inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.lock "${RUNNER_TEMP}/refreshed-lockfiles/engine-poc-mls-client.Cargo.lock"
          cp inone-engine-poc-0.6.0/mobile-mls/mls-bridge/Cargo.lock "${RUNNER_TEMP}/refreshed-lockfiles/engine-poc-mls-bridge.Cargo.lock"
          cp mobile/rust/Cargo.lock "${RUNNER_TEMP}/refreshed-lockfiles/mobile-rust.Cargo.lock"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refreshed-rust-lockfiles-${{ github.sha }}
          path: ${{ runner.temp }}/refreshed-lockfiles/*.Cargo.lock
          if-no-files-found: error
          retention-days: 7
