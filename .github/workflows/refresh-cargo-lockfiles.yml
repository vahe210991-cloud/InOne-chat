name: One-time Cargo lockfile verification

on:
  push:
    branches:
      - feat/mls-attachment-aead-core-2026-11-15
    paths:
      - ".github/workflows/refresh-cargo-lockfiles.yml"
      - "inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.toml"

permissions:
  contents: write

concurrency:
  group: cargo-lock-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: rustfmt
      - name: Update lockfile using the exact CI target check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --all-targets --manifest-path inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.toml || check_status=$?
          cargo metadata --locked --format-version 1 --manifest-path inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.toml > /dev/null
          echo "cargo check exit status: ${check_status:-0}"
      - name: Commit updated lockfile and remove one-time workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.lock
          git rm -f .github/workflows/refresh-cargo-lockfiles.yml
          git diff --cached --quiet && { echo "No lockfile change was produced"; exit 1; }
          git commit -m "chore(rust): align MLS lockfile with CI resolution"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:${GITHUB_REF_NAME}"
