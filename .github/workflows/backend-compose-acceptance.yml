name: Backend Docker Compose runtime acceptance

on:
  pull_request:
    paths:
      - "inone-development-archive-0.6.0/engine/**"
      - ".github/workflows/backend-compose-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "inone-development-archive-0.6.0/engine/**"
      - ".github/workflows/backend-compose-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: backend-compose-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compose-runtime:
    name: Compose build, PostgreSQL migrations and HTTP smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      POSTGRES_DB: inone
      POSTGRES_USER: inone
      POSTGRES_PASSWORD: inonecomposeci2026
      INONE_PIN_PEPPER: ci-compose-only-pepper-not-for-production-2026
    defaults:
      run:
        working-directory: inone-development-archive-0.6.0/engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record Docker toolchain
        run: |
          docker --version
          docker compose version
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend image
        run: docker compose build --pull
      - name: Start PostgreSQL and backend; wait for health
        run: docker compose up -d --wait --wait-timeout 150
      - name: Verify service health and public API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          response="$(curl --fail --silent --show-error http://127.0.0.1:8080/config/public)"
          node --input-type=module -e '
            const body = JSON.parse(process.argv[1]);
            if (!Number.isInteger(body.version) || !body.flags || typeof body.flags !== "object") {
              throw new Error("GET /config/public returned an invalid contract");
            }
          ' "$response"
      - name: Verify PostgreSQL schema and latest migration
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT version FROM schema_migrations WHERE version = '0031-file-upload-device-binding'" | grep -Fx '0031-file-upload-device-binding'
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT COUNT(*) FROM schema_migrations" | awk '$1 < 30 { exit 1 }'
      - name: Collect Compose diagnostics
        if: always()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --tail=200 || true
      - name: Stop stack and remove ephemeral volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
