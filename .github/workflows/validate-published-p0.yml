name: Validate recovered InOne P0 source

on:
  pull_request:
    paths:
      - "inone-development-archive-0.6.0/engine/**"
      - ".github/workflows/validate-published-p0.yml"
  push:
    branches: ["**"]
    paths:
      - "inone-development-archive-0.6.0/engine/**"
      - ".github/workflows/validate-published-p0.yml"

permissions:
  contents: read

# Keep runs for distinct SHAs alive: each job set is a complete, reproducible
# acceptance run for exactly one PR head, and all independent gates run in parallel.
concurrency:
  group: p0-validate-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  ENGINE_DIR: inone-development-archive-0.6.0/engine
  INONE_PIN_PEPPER: ci-only-pepper-not-used-outside-tests-2026

jobs:
  rust-format:
    name: Rust format (1.91)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
          components: rustfmt
      - name: Verify Rust formatting without modifying the PR branch
        working-directory: inone-development-archive-0.6.0/engine/mobile-mls
        run: |
          cargo fmt --manifest-path mls-client/Cargo.toml -- --check
          cargo fmt --manifest-path mls-bridge/Cargo.toml -- --check

  backend-node:
    name: Backend Node suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inone-development-archive-0.6.0/engine/package-lock.json
      - run: npm ci
        working-directory: ${{ env.ENGINE_DIR }}
      - name: Record Node toolchain versions
        run: |
          node --version | tee backend-node-environment.txt
          npm --version | tee -a backend-node-environment.txt
        working-directory: ${{ env.ENGINE_DIR }}
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
        working-directory: ${{ env.ENGINE_DIR }}
      - name: Run Node suite and preserve TAP output
        run: npm test 2>&1 | tee backend-node-test.log
        working-directory: ${{ env.ENGINE_DIR }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-node-${{ github.sha }}
          path: |
            inone-development-archive-0.6.0/engine/backend-node-environment.txt
            inone-development-archive-0.6.0/engine/backend-node-test.log
          if-no-files-found: warn
          retention-days: 14

  p0-room-list:
    name: P0 room-list regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inone-development-archive-0.6.0/engine/package-lock.json
      - run: npm ci
        working-directory: ${{ env.ENGINE_DIR }}
      - run: node --test test/rooms-mine.test.js
        working-directory: ${{ env.ENGINE_DIR }}

  postgres-integration:
    name: PostgreSQL integration suite
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inone_test
          POSTGRES_USER: inone
          POSTGRES_PASSWORD: inone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inone -d inone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://inone:inone@localhost:5432/inone_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inone-development-archive-0.6.0/engine/package-lock.json
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          /usr/lib/postgresql/16/bin/pg_dump --version
      - run: npm ci
        working-directory: ${{ env.ENGINE_DIR }}
      - name: Record PostgreSQL and Node toolchain versions
        run: |
          node --version | tee postgres-environment.txt
          npm --version | tee -a postgres-environment.txt
          psql --version | tee -a postgres-environment.txt
        working-directory: ${{ env.ENGINE_DIR }}
      - name: Run PostgreSQL suite and preserve TAP output
        run: npm run test:db 2>&1 | tee postgres-test.log
        working-directory: ${{ env.ENGINE_DIR }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-postgres-${{ github.sha }}
          path: |
            inone-development-archive-0.6.0/engine/postgres-environment.txt
            inone-development-archive-0.6.0/engine/postgres-test.log
          if-no-files-found: warn
          retention-days: 14

  openmls-client:
    name: OpenMLS client check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inone-development-archive-0.6.0/engine/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
      - run: npm ci
        working-directory: ${{ env.ENGINE_DIR }}
      - name: Check all OpenMLS client targets
        working-directory: inone-development-archive-0.6.0/engine/mobile-mls/mls-client
        run: cargo check --locked --all-targets
      - name: Record OpenMLS client toolchain versions
        run: |
          rustc --version | tee openmls-environment.txt
          cargo --version | tee -a openmls-environment.txt
          node --version | tee -a openmls-environment.txt
          npm --version | tee -a openmls-environment.txt
        working-directory: inone-development-archive-0.6.0/engine/mobile-mls/mls-client
      - name: Run all OpenMLS client tests and preserve output
        working-directory: inone-development-archive-0.6.0/engine/mobile-mls/mls-client
        run: cargo test --locked --no-fail-fast 2>&1 | tee openmls-client-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openmls-client-${{ github.sha }}
          path: |
            inone-development-archive-0.6.0/engine/mobile-mls/mls-client/openmls-environment.txt
            inone-development-archive-0.6.0/engine/mobile-mls/mls-client/openmls-client-test.log
          if-no-files-found: warn
          retention-days: 14

  rust-bridge:
    name: Rust bridge check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
      - name: Check all bridge targets
        working-directory: inone-development-archive-0.6.0/engine/mobile-mls/mls-bridge
        run: cargo check --locked --all-targets
      - name: Record Rust bridge toolchain versions
        run: |
          rustc --version | tee bridge-environment.txt
          cargo --version | tee -a bridge-environment.txt
        working-directory: inone-development-archive-0.6.0/engine/mobile-mls/mls-bridge
      - name: Run bridge tests and preserve output
        working-directory: inone-development-archive-0.6.0/engine/mobile-mls/mls-bridge
        run: cargo test --locked --no-fail-fast 2>&1 | tee bridge-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mls-bridge-${{ github.sha }}
          path: |
            inone-development-archive-0.6.0/engine/mobile-mls/mls-bridge/bridge-environment.txt
            inone-development-archive-0.6.0/engine/mobile-mls/mls-bridge/bridge-test.log
          if-no-files-found: warn
          retention-days: 14

# Exact-head P0 validation is enabled for this stacked PR branch.
