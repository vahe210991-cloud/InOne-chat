name: Synchronize native MLS lockfiles

on:
  push:
    branches:
      - feat/mls-attachment-aead-core-2026-11-15
      - feat/native-mls-persistent-ffi-2026-11-15
      - feat/mls-encrypted-attachment-flow-2026-11-15
    paths:
      - "inone-engine-poc-0.6.0/mobile-mls/**"
      - "mobile/rust/**"
      - ".github/workflows/sync-mls-lockfiles.yml"

permissions:
  contents: write

concurrency:
  group: sync-mls-lockfiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - name: Regenerate MLS client lockfile
        run: cargo generate-lockfile --manifest-path inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.toml
      - name: Regenerate persistent bridge lockfile when the crate exists
        if: hashFiles('mobile/rust/Cargo.toml') != ''
        run: cargo generate-lockfile --manifest-path mobile/rust/Cargo.toml
      - name: Commit lockfile changes on this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.lock
          if [ -f mobile/rust/Cargo.lock ]; then git add mobile/rust/Cargo.lock; fi
          if git diff --cached --quiet; then
            echo "Lockfiles are already synchronized."
            exit 0
          fi
          git commit -m "build(mls): synchronize native dependency lockfiles"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
