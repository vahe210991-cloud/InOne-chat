name: OpenMLS Flutter Rust Bridge generation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/openmls-frb-codegen.yml"
      - "mobile/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/openmls-frb-codegen.yml"
      - "mobile/**"

permissions:
  contents: read

concurrency:
  group: openmls-frb-codegen-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    if: github.actor != 'github-actions[bot]'
    outputs:
      generated_artifact_id: ${{ steps.upload-generated.outputs.artifact-id }}
    # Ubuntu x64 runners expose KVM for hardware-accelerated Android emulation.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Validated source SHA: $actual"

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Generate Android and iOS platform projects
        working-directory: mobile
        run: bash tool/generate_flutter_platforms.sh android,ios
      - name: Apply file_picker AGP 9 Kotlin compatibility workaround
        working-directory: mobile
        run: bash tool/patch_file_picker_agp9.sh
      - name: Verify Flutter project generation preserves dependency manifests
        run: git diff --exit-code -- mobile/pubspec.yaml mobile/pubspec.lock

      - name: Remove generated Flutter template tests
        working-directory: mobile
        # Keep the real MLS integration test; remove only Flutter's generated sample tests.
        run: rm -f test/widget_test.dart integration_test/simple_test.dart

      - name: Install Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master snapshot verified 2026-11-25
        with:
          toolchain: "1.94.0"
          components: rustfmt
          targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android"

      - name: Install pinned cargo-expand
        run: |
          cargo install --locked --version 1.0.127 cargo-expand
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Flutter Rust Bridge code generator
        run: cargo install --locked --version 2.13.0 flutter_rust_bridge_codegen

      - name: Run deterministic FRB generation and contract verification
        working-directory: mobile
        timeout-minutes: 30
        run: node tool/frb_ci.mjs

      - name: Prepare declared asset directories
        working-directory: mobile
        run: mkdir -p assets/ui-approval/assets/icons assets/ui-approval/assets/images

      - name: Prepare Android NDK context for native secure storage
        working-directory: mobile
        run: node tool/prepare_android_mls.mjs

      - name: Configure Maven repositories for Flutter's included Gradle build
        working-directory: mobile
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          install -m 0644 tool/gradle-plugin-repositories.init.gradle "$HOME/.gradle/init.d/inone-flutter-plugin-repositories.gradle"
          echo "Generated Android Gradle settings:"
          sed -n '1,80p' android/settings.gradle.kts
          echo "Generated Gradle wrapper:"
          cat android/gradle/wrapper/gradle-wrapper.properties
          flutter_sdk="$(sed -n 's/^flutter.sdk=//p' android/local.properties)"
          test -n "$flutter_sdk"
          echo "Flutter included-build settings:"
          sed -n '1,80p' "$flutter_sdk/packages/flutter_tools/gradle/settings.gradle.kts"

      - name: Register iOS recovery deep-link scheme
        working-directory: mobile
        run: node tool/prepare_ios_deep_links.mjs

      - name: Verify clean repeated FRB generation
        working-directory: mobile
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/frb-generation-first"
          mkdir -p "$snapshot"
          cp -a hook "$snapshot/hook"
          cp -a lib/src/rust "$snapshot/lib-src-rust"
          mkdir -p "$snapshot/rust/src"
          cp rust/src/frb_generated.rs rust/src/lib.rs "$snapshot/rust/src/"
          cp rust/Cargo.toml rust/Cargo.lock pubspec.yaml pubspec.lock "$snapshot/"
          rm -f rust/src/api/simple.rs lib/src/rust/api/simple.dart integration_test/simple_test.dart
          flutter_rust_bridge_codegen generate \
            --rust-input crate::api::session \
            --skip-fvm-install \
            --no-dart-fix \
            --no-dart-format \
            --no-auto-upgrade-dependency \
            --no-web \
            --stop-on-error
          # Keep the repeated native-only generation snapshot free of unsupported web glue.
          rm -f lib/src/rust/frb_generated.web.dart
          # cargo-expand can normalize the protected nested lockfile's trailing newline.
          git restore --worktree -- rust/Cargo.lock
          diff -ru "$snapshot/hook" hook
          diff -ru "$snapshot/lib-src-rust" lib/src/rust
          diff -u "$snapshot/rust/src/frb_generated.rs" rust/src/frb_generated.rs
          diff -u "$snapshot/rust/src/lib.rs" rust/src/lib.rs
          diff -u "$snapshot/Cargo.toml" rust/Cargo.toml
          diff -u "$snapshot/Cargo.lock" rust/Cargo.lock
          diff -u "$snapshot/pubspec.yaml" pubspec.yaml
          diff -u "$snapshot/pubspec.lock" pubspec.lock
          node tool/frb_ci.mjs --verify-only

      - name: Format generated Rust bridge module registration
        run: cargo fmt --manifest-path mobile/rust/Cargo.toml

      - name: Verify Rust formatting without modifying sources
        run: cargo fmt --manifest-path mobile/rust/Cargo.toml -- --check

      - name: Validate Rust bridge on Linux
        run: cargo test --locked --manifest-path mobile/rust/Cargo.toml

      - name: Validate Flutter code and session contract
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: Prepare FRB artifact with source provenance and checksums
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/inone-mls-frb-generated"
          rm -rf "$artifact"
          mkdir -p "$artifact/lib" "$artifact/rust/src"
          cp -a mobile/hook "$artifact/hook"
          mkdir -p "$artifact/lib/src"
          cp -a mobile/lib/src/rust "$artifact/lib/src/rust"
          cp mobile/rust/Cargo.toml "$artifact/rust/Cargo.toml"
          # Ship the exact Cargo.lock blob from the validated source SHA. This
          # avoids platform checkout filters or Cargo tooling rewriting the
          # working-tree copy between generation and artifact packaging.
          git show "$EXPECTED_SHA:mobile/rust/Cargo.lock" > "$artifact/rust/Cargo.lock"
          cp mobile/rust/src/lib.rs mobile/rust/src/frb_generated.rs "$artifact/rust/src/"
          cp mobile/pubspec.yaml mobile/pubspec.lock "$artifact/"
          printf '%s\n' "$EXPECTED_SHA" > "$artifact/source.sha"
          (
            cd "$artifact"
            find hook lib/src/rust rust pubspec.yaml pubspec.lock -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload generated FRB outputs for iOS validation
        id: upload-generated
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inone-mls-frb-generated
          path: ${{ runner.temp }}/inone-mls-frb-generated
          if-no-files-found: error

      - name: Build Android with native OpenMLS assets
        working-directory: mobile
        run: flutter build apk --debug --target-platform android-x64

      - name: Enable KVM for Android emulator
        run: |
          test -e /dev/kvm || { echo "::error::GitHub runner does not expose /dev/kvm; hardware-accelerated Android runtime tests cannot run."; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Android Keystore runtime smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # Pixel 2 keeps the same API/Keystore behavior with a smaller graphics
          # footprint than Pixel 6 on hosted KVM runners.
          profile: pixel_2
          cores: 2
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          # Run integration_test through Android instrumentation rather than the
          # legacy Flutter Driver VM Service. The old driver path intermittently
          # lost the emulator transport while attaching to the VM Service, even
          # though FRB, Rust, Flutter and both iOS builds had passed.
          # android-emulator-runner starts each script line in a fresh shell.
          # Keep cwd, variables, installation, permission grant and instrumentation
          # test inside one POSIX shell process; use the workspace-absolute APK path.
          script: |
            sh -c 'set -eu; adb devices; adb wait-for-device; apk="$GITHUB_WORKSPACE/mobile/build/app/outputs/flutter-apk/app-debug.apk"; test -f "$apk"; aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"; test -x "$aapt"; package_name="$("$aapt" dump badging "$apk" | head -n 1 | cut -d " " -f 2 | cut -d "=" -f 2 | tr -d "\\047")"; test -n "$package_name"; adb install -r "$apk"; adb shell pm grant "$package_name" android.permission.POST_NOTIFICATIONS; cd "$GITHUB_WORKSPACE/mobile"; flutter test integration_test/mls_secure_store_test.dart -d emulator-5554 || { adb logcat -d -t 5000 || true; exit 1; }'

      - name: Upload Android preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inone-mls-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  build-ios:
    name: iOS native assets compile (unsigned, no secrets)
    needs: generate-and-validate
    if: ${{ always() && needs.generate-and-validate.outputs.generated_artifact_id != '' }}
    # Firebase iOS SDK 13.1.1 requires Swift tools 6.2; macOS 26 ships Xcode 26.x.
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Validated source SHA: $actual"

      - name: Download generated bridge artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: inone-mls-frb-generated
          path: ${{ runner.temp }}/inone-mls-frb-generated

      - name: Copy generated bridge files without committing
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          GENERATED="$RUNNER_TEMP/inone-mls-frb-generated"
          if find "$GENERATED" -type l -print -quit | grep -q .; then
            echo "::error::Generated artifact contains a symlink; refusing to copy it."
            exit 1
          fi
          test -d "$GENERATED/hook"
          test -d "$GENERATED/lib/src/rust"
          test -f "$GENERATED/rust/Cargo.toml"
          test -f "$GENERATED/rust/Cargo.lock"
          test -f "$GENERATED/rust/src/lib.rs"
          test -f "$GENERATED/rust/src/frb_generated.rs"
          test -f "$GENERATED/pubspec.yaml"
          test -f "$GENERATED/pubspec.lock"
          test -f "$GENERATED/source.sha"
          test "$(cat "$GENERATED/source.sha")" = "$EXPECTED_SHA"
          (cd "$GENERATED" && sha256sum -c SHA256SUMS)
          # Integration must not silently change manually maintained manifests.
          cmp "$GENERATED/pubspec.yaml" mobile/pubspec.yaml
          cmp "$GENERATED/rust/Cargo.toml" mobile/rust/Cargo.toml
          # Compare the artifact with the exact Git blob, not a platform-
          # materialized working-tree file that may have different line endings.
          git show "$EXPECTED_SHA:mobile/rust/Cargo.lock" | cmp - "$GENERATED/rust/Cargo.lock"
          # The source job resolves the Firebase dependency graph and supplies its
          # generated lockfile as part of this checksummed artifact.
          mkdir -p mobile/hook mobile/lib/src/rust mobile/rust/src
          rsync -a "$GENERATED/hook/" mobile/hook/
          rsync -a "$GENERATED/lib/src/rust/" mobile/lib/src/rust/
          cp "$GENERATED/rust/src/lib.rs" mobile/rust/src/lib.rs
          cp "$GENERATED/rust/src/frb_generated.rs" mobile/rust/src/frb_generated.rs
          cp "$GENERATED/pubspec.lock" mobile/pubspec.lock

      - name: Install Flutter and iOS Rust targets
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install Rust iOS targets
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master snapshot verified 2026-11-25
        with:
          toolchain: "1.94.0"
          components: rustfmt
          targets: "aarch64-apple-ios,aarch64-apple-ios-sim"

      - name: Generate iOS platform project and configure recovery links
        working-directory: mobile
        run: |
          bash tool/generate_flutter_platforms.sh ios
          node tool/prepare_ios_deep_links.mjs

      - name: Resolve Flutter dependencies without lockfile drift
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml

      - name: Configure Rust iOS deployment target
        working-directory: mobile
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME"
          cat > "$CARGO_HOME/config.toml" <<'EOF'
          [env]
          IPHONEOS_DEPLOYMENT_TARGET = { value = "15.0", force = true }
          EOF
          cat "$CARGO_HOME/config.toml"

      - name: Capture Apple toolchain and linker environment
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          echo "Xcode:"
          xcodebuild -version
          echo "Rust:"
          rustc -vV
          cargo --version
          echo "Apple clang and SDK paths:"
          for sdk in iphoneos iphonesimulator; do
            echo "$sdk clang: $(xcrun --sdk "$sdk" --find clang)"
            echo "$sdk SDK: $(xcrun --sdk "$sdk" --show-sdk-path)"
          done
          echo "Relevant exported toolchain variables:"
          env | sort | grep -E '^(CC|CXX|SDKROOT|DEVELOPER_DIR|IPHONEOS_DEPLOYMENT_TARGET|CARGO_TARGET_|RUSTFLAGS|RUSTC_WRAPPER)=' || true
          echo "Generated Xcode linker/compiler settings:"
          grep -RniE '(^|[[:space:]])(CC|LD|OTHER_LDFLAGS|IPHONEOS_DEPLOYMENT_TARGET)[[:space:]]*=|%20|clang' ios/Flutter ios/Runner.xcodeproj 2>/dev/null || true

      - name: Build iOS simulator target without signing (verbose diagnostics)
        working-directory: mobile
        env:
          RUST_BACKTRACE: full
          RUST_LOG: debug
          CARGO_TERM_COLOR: never
        run: flutter build ios --simulator --no-codesign --verbose

      - name: Build iOS device target without signing (verbose diagnostics)
        working-directory: mobile
        env:
          RUST_BACKTRACE: full
          RUST_LOG: debug
          CARGO_TERM_COLOR: never
        run: flutter build ios --no-codesign --verbose

      - name: Upload unsigned iOS simulator build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inone-mls-ios-simulator-build
          path: mobile/build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
