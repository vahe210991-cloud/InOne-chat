name: Flutter iOS validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'inone-development-archive-0.6.0/engine/mobile-mls/**'
      - '.github/workflows/flutter-ios-validation.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'inone-development-archive-0.6.0/engine/mobile-mls/**'
      - '.github/workflows/flutter-ios-validation.yml'

permissions:
  contents: read

concurrency:
  group: flutter-ios-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  ios:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Validated source SHA: $actual"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Report Xcode and Flutter versions
        run: |
          xcodebuild -version
          flutter --version

      - name: Generate iOS platform project
        run: bash tool/generate_flutter_platforms.sh ios
      - name: Verify Flutter project generation preserves dependency manifests
        run: git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install Rust toolchain and Apple targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.0'
          components: rustfmt
          targets: 'aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios'

      - name: Install Flutter Rust Bridge code generator
        run: cargo install --locked --version 2.13.0 flutter_rust_bridge_codegen

      - name: Run deterministic FRB generation and contract verification
        timeout-minutes: 30
        run: node tool/frb_ci.mjs

      - name: Configure iOS recovery deep links
        run: node tool/prepare_ios_deep_links.mjs

      - name: Resolve Flutter dependencies without lockfile drift
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Analyze Flutter sources
        run: flutter analyze

      - name: Build unsigned iOS simulator app
        env:
          RUST_BACKTRACE: full
          RUST_LOG: debug
          CARGO_TERM_COLOR: never
        run: flutter build ios --simulator --no-codesign --verbose

      - name: Configure Rust iOS deployment target
        run: |
          # Cargo's [env] config forwards this value to rustc and native build scripts
          # spawned by the Flutter Rust Bridge native-assets hook.
          mkdir -p "$CARGO_HOME"
          cat > "$CARGO_HOME/config.toml" <<'EOF'
          [env]
          IPHONEOS_DEPLOYMENT_TARGET = { value = "15.0", force = true }
          EOF
          cat "$CARGO_HOME/config.toml"

      - name: Build unsigned iOS device app (verbose linker diagnostics)
        run: flutter build ios --no-codesign --verbose

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inone-beta1-ios-preview
          path: |
            mobile/build/ios/iphonesimulator/Runner.app
            mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
