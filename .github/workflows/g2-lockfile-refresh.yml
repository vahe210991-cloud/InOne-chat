name: G2 Lockfile Refresh

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  refresh-lockfiles:
    if: github.event.pull_request.head.ref == 'fix/g2-mls-ffi-hardening-2026-11-19' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout G2 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve MLS client lockfile
        run: cargo generate-lockfile --manifest-path inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.toml

      - name: Resolve mobile Rust bridge lockfile
        run: cargo generate-lockfile --manifest-path mobile/rust/Cargo.toml

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Commit reproducible lockfiles
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            inone-engine-poc-0.6.0/mobile-mls/mls-client/Cargo.lock \
            mobile/rust/Cargo.lock \
            mobile/pubspec.lock
          if git diff --cached --quiet; then
            echo "All G2 lockfiles are already current."
            exit 0
          fi
          git commit -m "build(g2): refresh reproducible native and Flutter lockfiles"
          git push origin "HEAD:${BRANCH_NAME}"
