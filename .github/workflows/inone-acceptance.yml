name: InOne exact-SHA acceptance gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: inone-acceptance-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  exact-sha-acceptance:
    name: Exact-SHA required workflow acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Verify PR head SHA and wait for every applicable validation workflow
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedSha = process.env.EXPECTED_SHA;
            const prNumber = Number(process.env.PR_NUMBER);
            if (!/^[0-9a-f]{40}$/i.test(expectedSha || "")) {
              core.setFailed("The PR head SHA is missing or malformed.");
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );
            const paths = files.map(file => file.filename);
            const starts = prefix => paths.some(path => path.startsWith(prefix));
            const expected = new Set();

            const workflowChanged = file => paths.includes(".github/workflows/" + file);
            const engine = "inone-development-archive-0.6.0/engine/";
            const engineMls = engine + "mobile-mls/";
            const pocMls = "inone-engine-poc-0.6.0/mobile-mls/";
            const mobile = "mobile/";
            const mobileRust = "mobile/rust/";

            if (workflowChanged("validate-published-p0.yml") ||
                starts(engine) || starts(pocMls) || starts(mobileRust) ||
                starts("development/prototypes/openmls-0.10-sqlcipher-compat/") ||
                starts("development/prototypes/openmls-0.9.2-sqlcipher-compat/")) {
              expected.add("Validate recovered InOne P0 source");
            }
            if (starts("development/prototypes/openmls-0.10-sqlcipher-compat/")) {
              expected.add("OpenMLS 0.10 SQLCipher compatibility prototype");
            }
            if (starts("development/prototypes/openmls-0.9.2-sqlcipher-compat/")) {
              expected.add("OpenMLS 0.9.2 SQLCipher compatibility prototype");
            }
            if (workflowChanged("mls-native-validation.yml") ||
                starts(pocMls) || starts(engineMls) || starts(mobileRust)) {
              expected.add("Native MLS client validation");
            }
            if (workflowChanged("flutter-mobile.yml") ||
                starts(mobile) || starts(engineMls)) {
              expected.add("Flutter mobile validation");
            }
            if (workflowChanged("flutter-ios-validation.yml") ||
                starts(mobile) || starts(engineMls)) {
              expected.add("Flutter iOS validation");
            }
            if (workflowChanged("openmls-frb-codegen.yml") || starts(mobile)) {
              expected.add("OpenMLS Flutter Rust Bridge generation");
            }
            if (workflowChanged("email-delivery-validation.yml") || starts(engine)) {
              expected.add("Email delivery and PostgreSQL validation");
            }
            if (workflowChanged("backend-compose-acceptance.yml") || starts(engine)) {
              expected.add("Backend Docker Compose runtime acceptance");
            }
            if (workflowChanged("devcontainer-runtime.yml") ||
                starts(".devcontainer/") || starts(engine)) {
              expected.add("Dev Container Compose runtime validation");
            }

            if (expected.size === 0) {
              core.notice("No heavyweight workflow is applicable to this PR file set; exact-SHA gate completed.");
              return;
            }

            core.info(`Acceptance SHA: ${expectedSha}`);
            core.info(`Applicable workflows: ${[...expected].join(", ")}`);
            const deadline = Date.now() + 120 * 60 * 1000;
            let lastState = new Map();

            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: expectedSha, per_page: 100
              });
              const runs = response.data.workflow_runs.filter(run =>
                run.head_sha === expectedSha && run.event === "pull_request"
              );
              const state = new Map();
              for (const name of expected) {
                const candidates = runs
                  .filter(run => run.name === name)
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                const run = candidates[0];
                if (!run) {
                  state.set(name, { status: "waiting", conclusion: null });
                } else {
                  state.set(name, {
                    status: run.status,
                    conclusion: run.conclusion,
                    url: run.html_url,
                    id: run.id
                  });
                }
              }
              lastState = state;
              core.info([...state].map(([name, value]) =>
                `${name}: ${value.status}/${value.conclusion || "pending"}`
              ).join("\n"));

              const failed = [...state].filter(([, value]) =>
                value.status === "completed" && value.conclusion !== "success"
              );
              if (failed.length) {
                core.setFailed("Applicable workflow failed: " + failed.map(([name, value]) =>
                  `${name} (${value.conclusion}) ${value.url || ""}`
                ).join("; "));
                return;
              }

              const complete = [...state.values()].every(value =>
                value.status === "completed" && value.conclusion === "success"
              );
              if (complete) {
                core.notice(`All ${expected.size} applicable workflows passed on exact SHA ${expectedSha}.`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }

            core.setFailed("Timed out waiting for exact-SHA workflows: " +
              [...lastState].filter(([, value]) => value.status !== "completed" || value.conclusion !== "success")
                .map(([name, value]) => `${name}=${value.status}/${value.conclusion || "pending"}`)
                .join(", "));
