name: One-time sync merged PR 118 branch with main

on:
  push:
    branches:
      - feature/push-notifications-foundation-2026-11-21
    paths:
      - .github/workflows/sync-pr118-branch-once.yml

permissions:
  contents: write

concurrency:
  group: sync-pr118-branch-once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch with full history
        uses: actions/checkout@v4
        with:
          ref: feature/push-notifications-foundation-2026-11-21
          fetch-depth: 0
          persist-credentials: true
      - name: Merge latest main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/sync-pr118-branch-once.yml
          git commit -m "chore: remove one-time PR 118 branch sync workflow"
          git push origin HEAD:feature/push-notifications-foundation-2026-11-21
