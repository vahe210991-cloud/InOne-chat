name: Temporary FRB lockfile refresh
on:
  push:
    branches:
      - feature/a2-frb-contract-reconciliation-2026-11-20
    paths:
      - .github/workflows/frb-lock-refresh.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Resolve Flutter dependency graph
        working-directory: mobile
        run: flutter pub get
      - name: Emit exact generated lockfile for commit
        working-directory: mobile
        shell: bash
        run: |
          echo LOCK_BASE64_BEGIN
          base64 -w0 pubspec.lock
          echo
          echo LOCK_BASE64_END
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frb-lockfile-refresh
          path: mobile/pubspec.lock
          if-no-files-found: error
          retention-days: 1
