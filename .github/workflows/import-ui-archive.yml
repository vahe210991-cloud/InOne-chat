name: Import owner-approved UI archive

on:
  push:
    branches:
      - task/ui-archive-import-2026-11-09
    paths:
      - .github/workflows/import-ui-archive.yml

permissions:
  contents: write

concurrency:
  group: ui-archive-import
  cancel-in-progress: false

jobs:
  import-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: task/ui-archive-import-2026-11-09
          fetch-depth: 0

      - name: Fetch uploaded archive from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:Ui.zip > "${RUNNER_TEMP}/Ui.zip"
          actual="$(sha256sum "${RUNNER_TEMP}/Ui.zip" | cut -d' ' -f1)"
          expected="cdff61b36673d45332f4809c5a42f1978e715adb3e4dcf280c96d92f3aa758bb"
          echo "Ui.zip SHA-256: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Uploaded Ui.zip differs from the locally audited owner archive. Expected $expected, got $actual"
            exit 1
          fi
          unzip -t "${RUNNER_TEMP}/Ui.zip"

      - name: Extract nested UI package and import runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ui-outer" "${RUNNER_TEMP}/ui-inner"
          unzip -q "${RUNNER_TEMP}/Ui.zip" -d "${RUNNER_TEMP}/ui-outer"
          inner="$(find "${RUNNER_TEMP}/ui-outer" -type f -name 'ui-approval.zip' -print -quit)"
          if [[ -z "$inner" ]]; then
            echo "::error::Expected nested ui-approval.zip was not found"
            find "${RUNNER_TEMP}/ui-outer" -maxdepth 3 -type f -print
            exit 1
          fi
          unzip -t "$inner"
          unzip -q "$inner" -d "${RUNNER_TEMP}/ui-inner"
          manifest="$(find "${RUNNER_TEMP}/ui-inner" -type f -name 'screen-manifest.json' -print -quit)"
          if [[ -z "$manifest" ]]; then
            echo "::error::screen-manifest.json was not found in nested archive"
            exit 1
          fi
          source_dir="$(dirname "$manifest")"
          node mobile/tool/import_ui_approval.mjs "$source_dir"
          test -f mobile/assets/ui-approval/IMPORT-MANIFEST.json
          test "$(find mobile/assets/ui-approval -type f -name '*.html' | wc -l)" -eq 31
          echo "Imported HTML screens: $(find mobile/assets/ui-approval -type f -name '*.html' | wc -l)"
          echo "Imported WOFF2 fonts: $(find mobile/assets/ui-approval -type f -name '*.woff2' | wc -l)"
          git status --short

      - name: Commit imported source assets to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/ui-approval
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
          else
            git commit -m "feat(ui): import owner-approved UI source assets"
            git push origin HEAD:task/ui-archive-import-2026-11-09
          fi

      - name: Verify Flutter bundle and tests
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter source
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
