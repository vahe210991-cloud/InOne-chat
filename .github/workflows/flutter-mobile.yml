name: Flutter mobile validation

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'

permissions:
  contents: read

concurrency:
  group: flutter-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # PR validation must run on the writable head branch, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter --version
      - name: Generate Android and iOS platform projects
        run: flutter create --platforms=android,ios --project-name inone_mobile --org com.inone .
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Verify native-only mobile runtime
        run: node tool/verify_native_runtime.mjs
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android preview APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: inone-beta1-android-preview
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
