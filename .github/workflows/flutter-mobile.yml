name: Flutter mobile validation
# This workflow is part of the synchronized exact-HEAD CI gate for this PR.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'inone-development-archive-0.6.0/engine/mobile-mls/**'
      - '.github/workflows/flutter-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'inone-development-archive-0.6.0/engine/mobile-mls/**'
      - '.github/workflows/flutter-mobile.yml'

# Pull request code is untrusted; this workflow validates the native Flutter bridge and tests on each branch head.
permissions:
  contents: read

concurrency:
  group: flutter-mobile-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  flutter:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref != 'feature/stage-4-native-mls-runtime-2026-11-11' && github.ref_name != 'feature/stage-4-native-mls-runtime-2026-11-11'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PR validation must run on the writable head branch, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Validated source SHA: $actual"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter --version
      - name: Generate Android and iOS platform projects
        run: bash tool/generate_flutter_platforms.sh android,ios
      - name: Apply file_picker AGP 9 Kotlin compatibility workaround
        run: bash tool/patch_file_picker_agp9.sh
      - name: Verify Flutter project generation preserves dependency manifests
        run: git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master snapshot verified 2026-11-25
        with:
          toolchain: "1.94.0"
          components: rustfmt
          targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android"

      - name: Install Flutter Rust Bridge code generator
        run: cargo install --locked --version 2.13.0 flutter_rust_bridge_codegen

      - name: Run deterministic FRB generation and contract verification
        timeout-minutes: 30
        run: node tool/frb_ci.mjs

      - name: Prepare Android NDK context for native secure storage
        run: node tool/prepare_android_mls.mjs

      - name: Configure Gradle Plugin Portal before rate-limited Maven Central
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          install -m 0644 tool/gradle-plugin-repositories.init.gradle "$HOME/.gradle/init.d/inone-flutter-plugin-repositories.gradle"
          test -s "$HOME/.gradle/init.d/inone-flutter-plugin-repositories.gradle"
      - name: Record generated Android Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          wrapper="android/gradle/wrapper/gradle-wrapper.properties"
          test -s "$wrapper" || { echo "::error::Generated Gradle wrapper properties are missing"; exit 1; }
          cp "$wrapper" "$RUNNER_TEMP/android-gradle-wrapper.properties"
          grep -E '^distributionUrl=' "$wrapper"
      - name: Verify Gradle Kotlin DSL plugin marker availability
        shell: bash
        run: |
          set -euo pipefail
          marker_url="https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/6.4.2/org.gradle.kotlin.kotlin-dsl.gradle.plugin-6.4.2.pom"
          marker="$RUNNER_TEMP/gradle-kotlin-dsl-plugin-marker-6.4.2.pom"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors "$marker_url" --output "$marker"
          test -s "$marker"
          sha256sum "$marker"
          sed -n '1,40p' "$marker"
      - name: Fetch and verify owner UI archive
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:Ui.zip > "${RUNNER_TEMP}/Ui.zip"
          actual="$(sha256sum "${RUNNER_TEMP}/Ui.zip" | cut -d' ' -f1)"
          expected="cdff61b36673d45332f4809c5a42f1978e715adb3e4dcf280c96d92f3aa758bb"
          echo "Ui.zip SHA-256: $actual"
          test "$actual" = "$expected" || { echo "::error::Ui.zip SHA-256 mismatch"; exit 1; }
          unzip -t "${RUNNER_TEMP}/Ui.zip"

      - name: Extract nested UI package and import Flutter assets
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ui-outer" "${RUNNER_TEMP}/ui-inner"
          unzip -q "${RUNNER_TEMP}/Ui.zip" -d "${RUNNER_TEMP}/ui-outer"
          inner="$(find "${RUNNER_TEMP}/ui-outer" -type f -name 'ui-approval.zip' -print -quit)"
          test -n "$inner" || { echo "::error::Nested ui-approval.zip not found"; exit 1; }
          unzip -t "$inner"
          unzip -q "$inner" -d "${RUNNER_TEMP}/ui-inner"
          manifest="$(find "${RUNNER_TEMP}/ui-inner" -type f -name 'screen-manifest.json' -print -quit)"
          test -n "$manifest" || { echo "::error::screen-manifest.json not found"; exit 1; }
          node mobile/tool/import_ui_approval.mjs "$(dirname "$manifest")"
          screen_count="$(find mobile/assets/ui-approval/screens -type f -name '*.html' | wc -l | tr -d ' ')"
          html_count="$(find mobile/assets/ui-approval -type f -name '*.html' | wc -l | tr -d ' ')"
          font_count="$(find mobile/assets/ui-approval -type f -name '*.woff2' | wc -l | tr -d ' ')"
          echo "Imported screen HTML files: $screen_count (expected 31)"
          echo "Total HTML files including package index: $html_count (expected 32)"
          echo "Imported WOFF2 fonts: $font_count (expected 5)"
          if [ "$screen_count" -ne 31 ] || [ "$html_count" -ne 32 ]; then
            echo "::error::Unexpected HTML file count (screens=$screen_count, total=$html_count)"
            find mobile/assets/ui-approval -type f -name '*.html' -print
            exit 1
          fi
          if [ "$font_count" -ne 5 ]; then
            echo "::error::Expected exactly 5 WOFF2 fonts, found $font_count"
            find mobile/assets/ui-approval -type f -name '*.woff2' -print
            exit 1
          fi
          # Generated UI assets stay in this ephemeral runner workspace; never push from pull_request.
      - name: Verify approved cross-platform screen geometry
        run: node tool/verify_approved_html.mjs
      - name: Remove ephemeral HTML reference assets from the mobile package
        run: rm -rf assets
      - name: Verify committed Flutter dependencies for Firebase runtime
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Verify native-only production runtime
        run: node tool/verify_native_runtime.mjs
      - name: Verify committed Rust lockfile
        run: test -s rust/Cargo.lock
      - name: Validate native bridge against committed lockfile
        run: |
          cargo check --locked --all-targets --manifest-path rust/Cargo.toml
          cargo test --locked --no-fail-fast --manifest-path rust/Cargo.toml
      - run: flutter analyze lib test integration_test
      - run: flutter test
      - name: Build Android preview APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.logging.level=info"
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee "$RUNNER_TEMP/flutter-android-build.log"
      - name: Verify and grant access to KVM on the ephemeral runner
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo "::error::KVM device /dev/kvm is unavailable on this runner"; exit 1; }
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm || { echo "::error::KVM device is not readable and writable"; exit 1; }
          echo "KVM device is available; hardware acceleration is required."
      - name: Android runtime smoke — Keystore and SQLCipher lifecycle
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: cd mobile && sh tool/android_runtime_smoke.sh

      - name: Upload Android runtime and Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inone-android-runtime-diagnostics-${{ github.run_id }}
          path: |
            /tmp/inone-android-runtime-diagnostics/**
            ${{ runner.temp }}/flutter-android-build.log
            ${{ runner.temp }}/android-gradle-wrapper.properties
            ${{ runner.temp }}/gradle-kotlin-dsl-plugin-marker-6.4.2.pom
            mobile/android/gradle/wrapper/gradle-wrapper.properties
            mobile/android/settings.gradle
            mobile/android/build.gradle
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inone-beta1-android-preview
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
