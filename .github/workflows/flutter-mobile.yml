name: Flutter mobile validation

on:
  push:
    branches:
      - feat/flutter-ui-dart-migration-2026-11-14
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile.yml'

permissions:
  contents: read

concurrency:
  group: flutter-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # Validate the complete stacked PR result, including its current base branch.
          ref: ${{ github.sha }}
      - name: Verify original 73-screen test gallery
        run: node tool/verify_test_gallery.mjs
      - name: Verify owner-approved HTML baseline
        run: node tool/verify_approved_html.mjs
      - name: Fetch and verify canonical owner UI archive
        run: |
          git -C .. fetch origin main --depth=1
          git -C .. show FETCH_HEAD:Ui.zip > ../Ui.zip
          printf "%s  %s\n" "cdff61e49e2b4fefc1e3a6c9b9b67f5a" "../Ui.zip" | sha256sum -c -
      - name: Import approved UI package as reference assets
        run: |
          rm -rf "$RUNNER_TEMP/inone-ui"
          mkdir -p "$RUNNER_TEMP/inone-ui"
          unzip -q ../Ui.zip -d "$RUNNER_TEMP/inone-ui"
          SOURCE="$(find "$RUNNER_TEMP/inone-ui" -type f -name screen-manifest.json -print -quit)"
          test -n "$SOURCE"
          node tool/import_ui_approval.mjs "$(dirname "$SOURCE")"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter --version
      - name: Detect persistent native MLS bridge
        id: native
        run: |
          if [ -f rust/Cargo.toml ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate Android and iOS platform projects
        run: flutter create --platforms=android,ios --project-name inone_mobile --org com.inone .
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Verify native-only mobile runtime
        run: node tool/verify_native_runtime.mjs
      - name: Install Rust toolchain and Android targets
        if: steps.native.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: rustfmt
          targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android"
      - name: Install Flutter Rust Bridge code generator
        if: steps.native.outputs.enabled == 'true'
        run: cargo install --locked --version 2.13.0 flutter_rust_bridge_codegen
      - name: Integrate Native Assets for Flutter Rust bridge
        if: steps.native.outputs.enabled == 'true'
        timeout-minutes: 15
        env:
          RUST_LOG: debug
        run: |
          cp lib/main.dart "$RUNNER_TEMP/inone-main.dart"
          cp rust/src/api/mod.rs "$RUNNER_TEMP/inone-api-mod.rs"
          flutter_rust_bridge_codegen integrate \
            --rust-crate-dir rust \
            --rust-crate-name inone_mls_frb \
            --integration-backend native-assets \
            --platforms android,ios \
            --skip-fvm-install \
            --no-dart-fix \
            --no-dart-format \
            --no-integration-test
          cp "$RUNNER_TEMP/inone-main.dart" lib/main.dart
          cp "$RUNNER_TEMP/inone-api-mod.rs" rust/src/api/mod.rs
          rm -f rust/src/api/simple.rs lib/src/rust/api/simple.dart
      - name: Generate typed Dart bindings
        if: steps.native.outputs.enabled == 'true'
        timeout-minutes: 15
        env:
          RUST_LOG: debug
        run: flutter_rust_bridge_codegen generate --skip-fvm-install
      - name: Prepare Android NDK context for native secure storage
        if: steps.native.outputs.enabled == 'true'
        run: node tool/prepare_android_mls.mjs
      - run: flutter pub get
      - name: Generate Rust lockfile and validate native bridge
        if: steps.native.outputs.enabled == 'true'
        run: |
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo check --locked --all-targets --manifest-path rust/Cargo.toml
          cargo test --locked --no-fail-fast --manifest-path rust/Cargo.toml
      - run: flutter analyze
      - run: flutter test
      - name: Build Android preview APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: inone-beta1-android-preview
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
