name: Refresh canonical MLS lockfile (temporary)

on:
  push:
    branches:
      - lockfile-refresh-pr116

permissions:
  contents: write

concurrency:
  group: refresh-mls-lockfile-pr116
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: rustfmt
      - name: Regenerate only the canonical MLS lockfile
        run: cargo generate-lockfile --manifest-path inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.toml
      - name: Verify lockfile with locked resolver
        run: cargo check --locked --all-targets --manifest-path inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.toml
      - name: Commit generated lockfile only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git diff --exit-code -- inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.toml
          git add inone-development-archive-0.6.0/engine/mobile-mls/mls-client/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfile already matches the manifest; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(mls): refresh canonical Cargo lockfile"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:lockfile-refresh-pr116
