name: G2 staging authorization validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require controlled staging credentials
        env:
          INONE_STAGING_BASE_URL: ${{ secrets.INONE_STAGING_BASE_URL }}
          INONE_STAGING_OWNER_TOKEN: ${{ secrets.INONE_STAGING_OWNER_TOKEN }}
          INONE_STAGING_ADMIN_TOKEN: ${{ secrets.INONE_STAGING_ADMIN_TOKEN }}
          INONE_STAGING_USER_TOKEN: ${{ secrets.INONE_STAGING_USER_TOKEN }}
          INONE_STAGING_OUTSIDER_TOKEN: ${{ secrets.INONE_STAGING_OUTSIDER_TOKEN }}
        run: |
          test -n "$INONE_STAGING_BASE_URL"
          test -n "$INONE_STAGING_OWNER_TOKEN"
          test -n "$INONE_STAGING_ADMIN_TOKEN"
          test -n "$INONE_STAGING_USER_TOKEN"
          node inone-development-archive-0.6.0/engine/scripts/verify-org-request-staging.mjs
