name: OpenMLS 0.10 SQLCipher compatibility prototype

on:
  push:
    branches:
      - security/prototype-openmls-signer-compat-2026-11-26
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compatibility:
    name: Legacy 0.8.1 SQLCipher database read by candidate 0.10
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout prototype
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate the stacked Stage 5 RustSec workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/validate-published-p0.yml")'
      - name: Validate Stage 5 workflow with actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/validate-published-p0.yml

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned toolchain action snapshot
        with:
          toolchain: "1.94.0"
          components: rustfmt

      - name: Check prototype formatting
        run: |
          cargo fmt --manifest-path development/prototypes/openmls-0.10-sqlcipher-compat/legacy-writer/Cargo.toml --
          cargo fmt --manifest-path development/prototypes/openmls-0.10-sqlcipher-compat/current-reader/Cargo.toml --

      - name: Generate legacy SQLCipher database and validate candidate reader
        run: bash development/prototypes/openmls-0.10-sqlcipher-compat/scripts/run.sh

      - name: Install pinned RustSec CLI
        run: cargo install --locked --version 0.23.0 cargo-audit

      - name: Audit the candidate lockfile with RustSec
        id: rustsec_audit
        continue-on-error: true
        run: cargo audit --file development/prototypes/openmls-0.10-sqlcipher-compat/current-reader/Cargo.lock

      - name: Upload generated candidate dependency lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openmls-010-candidate-lockfile-${{ github.run_id }}
          path: |
            development/prototypes/openmls-0.10-sqlcipher-compat/current-reader/Cargo.lock
            development/prototypes/openmls-0.10-sqlcipher-compat/legacy-writer/src/main.rs
            development/prototypes/openmls-0.10-sqlcipher-compat/current-reader/src/lib.rs
          if-no-files-found: error
          retention-days: 7

      - name: Commit candidate lockfile and rustfmt output to the prototype branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add development/prototypes/openmls-0.10-sqlcipher-compat/current-reader/Cargo.lock
          git add development/prototypes/openmls-0.10-sqlcipher-compat/legacy-writer/src/main.rs
          git add development/prototypes/openmls-0.10-sqlcipher-compat/current-reader/src/lib.rs
          if git diff --cached --quiet; then
            echo "Candidate lockfile and formatted sources are already committed."
          else
            git commit -m "test: record OpenMLS 0.10 SQLCipher compatibility lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Keep RustSec findings blocking after preserving test evidence
        if: steps.rustsec_audit.outcome == 'failure'
        run: |
          echo "::error::Candidate RustSec audit found advisories; generated lockfile and evidence were preserved for review."
          exit 1
