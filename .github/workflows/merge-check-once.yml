name: One-time feature-base conflict diagnosis

on:
  push:
    branches:
      - feat/native-mls-persistent-ffi-2026-11-15
      - feat/mls-encrypted-attachment-flow-2026-11-15
    paths:
      - ".github/workflows/merge-check-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Detect conflicts against current feature base
        shell: bash
        run: |
          set -u
          git fetch origin feat/flutter-ui-dart-migration-2026-11-14
          git merge --no-commit --no-ff origin/feat/flutter-ui-dart-migration-2026-11-14 || true
          echo "UNMERGED PATHS:"
          git diff --name-only --diff-filter=U
          echo "MERGE STATUS:"
          git status --short
