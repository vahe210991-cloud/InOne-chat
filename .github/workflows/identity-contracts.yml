name: Identity contract validation

on:
  pull_request:
    paths:
      - "architecture/identity/**"
      - ".github/workflows/identity-contracts.yml"
  push:
    branches:
      - "stage0/identity-engineering-readiness-2026-11-13"
    paths:
      - "architecture/identity/**"
      - ".github/workflows/identity-contracts.yml"

permissions:
  contents: read

concurrency:
  group: identity-contract-validation
  cancel-in-progress: true

jobs:
  validate-contracts:
    name: Validate OpenAPI and AsyncAPI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:26-bookworm-slim
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Lint OpenAPI 3.1 contract
        run: npx --yes @redocly/cli@2.77.0 lint architecture/identity/contracts/identity-openapi-v1.yaml

      - name: Lint AsyncAPI 3.0 event contract
        run: npx --yes @redocly/cli@2.77.0 lint architecture/identity/contracts/identity-events-v1.asyncapi.yaml
