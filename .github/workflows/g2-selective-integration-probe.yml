name: G2 selective integration probe

on:
  push:
    branches:
      - integration/g2-org-requests-main-2026-11-22

permissions:
  contents: write

jobs:
  selective-port:
    if: "!startsWith(github.event.head_commit.message, 'chore(g2): selectively port PR 87')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/g2-org-requests-main-2026-11-22
          fetch-depth: 0
      - name: Fetch source PR commit
        run: |
          git fetch origin eab331fa4efb36cc1f69e8f11ce0c4436fe4fee1
      - name: Apply PR 87 delta onto current main-based branch
        shell: bash
        run: |
          set -euo pipefail
          BASE=a174f794535ab09699d38292acb4919308873fd7
          SOURCE=eab331fa4efb36cc1f69e8f11ce0c4436fe4fee1
          git cat-file -e "${BASE}^{commit}"
          git cat-file -e "${SOURCE}^{commit}"
          git diff --binary "${BASE}" "${SOURCE}" > /tmp/pr87.patch
          if git apply --3way --index /tmp/pr87.patch; then
            echo "Patch applied cleanly with three-way context."
          else
            echo "::error::PR 87 has conflicts against current main. No integration commit was created."
            git status --short
            git diff --name-only --diff-filter=U || true
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No source changes to port."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore(g2): selectively port PR 87 onto current main"
          git push origin HEAD:refs/heads/integration/g2-org-requests-main-2026-11-22
