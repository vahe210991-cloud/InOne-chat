services:
  identity-workspace:
    image: mcr.microsoft.com/devcontainers/javascript-node:26-bookworm
    command: sleep infinity
    init: true
    working_dir: /workspaces/InOne-chat
    volumes:
      - ../../:/workspaces/InOne-chat:cached
    environment:
      NODE_ENV: development
      IDENTITY_DATABASE_URL: postgres://identity_dev:identity_local_only@postgres:5432/identity_dev
      IDENTITY_PUBLIC_ISSUER: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: identity_dev
      POSTGRES_PASSWORD: identity_local_only
      POSTGRES_DB: identity_dev
    volumes:
      - identity-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_dev -d identity_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  identity-postgres-data:
