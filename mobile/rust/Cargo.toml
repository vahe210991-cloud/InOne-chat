[package]
name = "inone_mls_frb"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
mls-client = { path = "../../inone-development-archive-0.6.0/engine/mobile-mls/mls-client" }
keyring-core = "1.0"
getrandom = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9.1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
ndk-context = "0.1.1"
jni = "0.21.1"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[patch.crates-io]
openmls_rust_crypto = { path = "../../inone-development-archive-0.6.0/engine/mobile-mls/vendor/openmls_rust_crypto" }
openmls_basic_credential = { path = "../../inone-development-archive-0.6.0/engine/mobile-mls/vendor/openmls_basic_credential" }
openmls_libcrux_crypto = { path = "../../inone-development-archive-0.6.0/engine/mobile-mls/vendor/openmls_libcrux_crypto" }
openmls_sqlite_storage = { path = "../../inone-development-archive-0.6.0/engine/mobile-mls/vendor/openmls_sqlite_storage" }
refinery-core = { path = "../../inone-development-archive-0.6.0/engine/mobile-mls/vendor/refinery-core" }
