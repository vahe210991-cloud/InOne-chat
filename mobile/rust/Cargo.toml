# Keep this lockfile committed and validated with --locked on Rust 1.91.0.
[package]
name = "inone_mls_frb"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
mls-client = { path = "../../inone-engine-poc-0.6.0/mobile-mls/mls-client" }
keyring-core = "1.0"
getrandom = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9.1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
ndk-context = "0.1.1"
jni = "0.21.1"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
