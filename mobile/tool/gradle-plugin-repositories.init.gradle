// Resolve Gradle plugin markers from the Plugin Portal first. Google Maven and
// Maven Central remain fallback repositories for Android/Kotlin transitive artifacts.
// Flutter's included Gradle build has independent pluginManagement repositories,
// so the app's generated settings.gradle.kts alone is not sufficient.
gradle.beforeSettings { settings ->
    settings.pluginManagement.repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
