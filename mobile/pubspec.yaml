name: inone_mobile
description: InOne Beta 1.0 mobile application shell and screen test host
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^3.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.2.3
flutter:
  uses-material-design: true
  assets:
    - assets/approved-ui/InOne-approved-cross-platform.html
    - assets/test-ui/
    - assets/ui-approval/
    - assets/ui-approval/screens/admin/
    - assets/ui-approval/screens/auth/
    - assets/ui-approval/screens/chat/
    - assets/ui-approval/screens/menu/
    - assets/ui-approval/screens/organizations/
    - assets/ui-approval/screens/profile/
    - assets/ui-approval/screens/rooms/
    - assets/ui-approval/screens/search/
    - assets/ui-approval/screens/settings/
    - assets/ui-approval/assets/fonts/
    - assets/ui-approval/assets/icons/
    - assets/ui-approval/assets/images/
