name: inone_mobile
description: InOne Beta 1.0 mobile application shell and screen test host
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  flutter_rust_bridge: ^2.13.0
  flutter_rust_bridge_hooks: ^2.13.0
  freezed_annotation: ^3.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  crypto: ^3.0.8
  flutter_lints: ^5.0.0
  freezed: ^3.2.3
  build_runner: ^2.7.1
dependency_overrides:
  # Keep app-private directory lookup on the platform channel implementation.
  # path_provider_android 2.3.x switched this code path to JNI and fails while
  # resolving android.content.Context in the Android integration runtime.
  path_provider_android: 2.2.23
flutter:
  uses-material-design: true
