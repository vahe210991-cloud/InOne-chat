# Local/CI backend stack. Runtime configuration is injected through environment variables.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inone}
      POSTGRES_USER: ${POSTGRES_USER:-inone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inone} -d ${POSTGRES_DB:-inone}"]
      interval: 5s
      retries: 20
  app:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-inone}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-inone}"
      INONE_PIN_PEPPER: "${INONE_PIN_PEPPER:?INONE_PIN_PEPPER must be set}"
      INONE_PUBLIC_URL: ${INONE_PUBLIC_URL:-https://inone.invalid}
      INONE_REGISTRATION_MODE: verified
      INONE_MAIL_TRANSPORT: smtp
      INONE_SMTP_HOST: ${INONE_SMTP_HOST:-127.0.0.1}
      INONE_SMTP_PORT: ${INONE_SMTP_PORT:-587}
      INONE_SMTP_SECURE: "false"
      INONE_SMTP_REQUIRE_TLS: "true"
      INONE_SMTP_FROM: ${INONE_SMTP_FROM:-ci@inone.invalid}
      INONE_EMAIL_ENCRYPTION_KEY: ${INONE_EMAIL_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      INONE_FILES_DIR: ${INONE_FILES_DIR:-/tmp/inone-files}
      INONE_DOCS_SECRET: ${INONE_DOCS_SECRET:-ci-docs-secret-not-for-production-2026}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
volumes:
  pgdata:
