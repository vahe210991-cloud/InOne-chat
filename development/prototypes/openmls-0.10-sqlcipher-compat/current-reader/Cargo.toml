[package]
name = "inone-openmls-010-compat-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[dependencies]
openmls = { version = "=0.10.0-rc.1", default-features = false, features = ["0-8-1-storage-format", "libcrux-provider", "sqlite-provider"] }
openmls_libcrux_crypto = "=0.5.0-rc.1"
openmls_traits = "=0.7.0-rc.1"
openmls_sqlite_storage = "=0.4.0-rc.1"
rusqlite = { version = "=0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
