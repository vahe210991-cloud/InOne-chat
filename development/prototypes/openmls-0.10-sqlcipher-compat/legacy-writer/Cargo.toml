[package]
name = "inone-openmls-081-fixture"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
openmls = { version = "=0.8.1", default-features = false, features = ["sqlite-provider"] }
openmls_rust_crypto = "=0.5.0"
openmls_basic_credential = "=0.5.0"
openmls_sqlite_storage = "=0.2.0"
rusqlite = { version = "=0.32.1", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
