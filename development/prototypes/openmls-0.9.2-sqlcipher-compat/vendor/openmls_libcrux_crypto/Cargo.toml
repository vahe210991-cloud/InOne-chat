[package]
name = "openmls_libcrux_crypto"
version = "0.4.0"
edition = "2021"
rust-version = "1.91"
authors = ["OpenMLS Authors"]
description = "A crypto backend for OpenMLS based on libcrux implementing openmls_traits."
license = "MIT"
documentation = "https://docs.rs/openmls_libcrux_crypto"
repository = "https://github.com/openmls/openmls/tree/main/openmls_libcrux_crypto"
readme = "README.md"

[dependencies]
libcrux-aead = "=0.0.11"
libcrux-ed25519 = { version = "=0.0.11", features = ["rand"] }
libcrux-hkdf = "=0.0.10"
libcrux-sha2 = "=0.0.10"
libcrux-hmac = "=0.0.10"
libcrux-hmac-drbg = { version = "=0.0.3", features = ["rand", "sys_rng"] }
libcrux-traits = "=0.0.10"
libcrux-ecdsa = { version = "=0.0.10", features = ["rand"] }
libcrux-ml-dsa = { version = "0.0.12", optional = true }
libcrux-sha3 = { version = "0.0.12", optional = true }
openmls_traits = "=0.6.0"
openmls_memory_storage = "=0.6.0"
zeroize = "=1.9.1"
rand = "0.10"
tls_codec = { version = "0.5", features = ["derive", "serde", "mls"] }
hpke-rs = { version = "=0.8.0", features = ["hazmat", "serialization"] }
hpke-rs-crypto = "=0.8.0"
hpke-rs-libcrux = "=0.8.0"
fpe = { version = "0.7", optional = true }
aes = { version = "0.9", optional = true }

[features]
extensions-draft = ["openmls_traits/extensions-draft", "openmls_memory_storage/extensions-draft"]
draft-ietf-mls-pq-ciphersuites = ["openmls_traits/draft-ietf-mls-pq-ciphersuites", "openmls_memory_storage/draft-ietf-mls-pq-ciphersuites", "dep:libcrux-ml-dsa", "hpke-rs-libcrux/draft-ietf-hpke-pq"]
legacy-pq-key-derivation = ["draft-ietf-mls-pq-ciphersuites", "dep:libcrux-sha3"]
virtual-clients-draft = ["extensions-draft", "openmls_traits/virtual-clients-draft", "openmls_memory_storage/virtual-clients-draft", "dep:fpe", "dep:aes"]
targeted-messages-draft = ["openmls_traits/targeted-messages-draft"]
