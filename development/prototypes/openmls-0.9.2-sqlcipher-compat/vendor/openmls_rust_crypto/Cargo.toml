[package]
name = "openmls_rust_crypto"
version = "0.6.0"
authors = ["OpenMLS Authors"]
edition = "2021"
rust-version = "1.91"
description = "A crypto backend for OpenMLS implementing openmls_traits using RustCrypto primitives."
license = "MIT"
documentation = "https://docs.rs/openmls_rust_crypto"
repository = "https://github.com/openmls/openmls/tree/main/openmls_rust_crypto"
readme = "README.md"

[dependencies]
openmls_traits = "=0.6.0"
openmls_memory_storage = "=0.6.0"

hpke = { version = "=0.8.0", package = "hpke-rs", default-features = false, features = ["hazmat", "serialization"] }
sha2 = "0.11"
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
hmac = "0.13"
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }
rand_core = "=0.10.1"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
p256 = "=0.14.0"
p384 = "=0.14.0"
hkdf = "0.13"
rand_chacha = "=0.10.0"
hpke-rs-crypto = "=0.8.0"
hpke-rs-rust-crypto = "=0.8.0"
tls_codec = { version = "0.5", features = ["derive", "serde", "mls"] }
ml-dsa = { version = "0.1.0", optional = true }
thiserror = "2"
fpe = { version = "0.7", optional = true }
aes = { version = "0.9", optional = true }

[features]
test-utils = ["openmls_memory_storage/test-utils"]
extensions-draft = ["openmls_traits/extensions-draft", "openmls_memory_storage/extensions-draft"]
targeted-messages-draft = ["openmls_traits/targeted-messages-draft"]
draft-ietf-mls-pq-ciphersuites = ["openmls_traits/draft-ietf-mls-pq-ciphersuites", "dep:ml-dsa", "hpke-rs-rust-crypto/experimental"]
virtual-clients-draft = ["openmls_traits/virtual-clients-draft", "openmls_memory_storage/virtual-clients-draft", "dep:fpe", "dep:aes"]
