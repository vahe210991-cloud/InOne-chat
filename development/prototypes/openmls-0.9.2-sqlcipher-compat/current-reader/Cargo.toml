[package]
name = "inone-openmls-092-compat-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[dependencies]
openmls = { version = "=0.9.2", default-features = false, features = ["0-8-1-storage-format", "libcrux-provider", "sqlite-provider"] }
openmls_libcrux_crypto = "=0.4.0"
openmls_traits = "=0.6.0"
openmls_sqlite_storage = { path = "../vendor/openmls_sqlite_storage" }
openmls_basic_credential = { path = "../vendor/openmls_basic_credential" }
rusqlite = { version = "=0.42.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
openmls_sqlite_storage = { path = "../vendor/openmls_sqlite_storage" }
openmls_basic_credential = { path = "../vendor/openmls_basic_credential" }
refinery-core = { path = "../vendor/refinery-core" }
