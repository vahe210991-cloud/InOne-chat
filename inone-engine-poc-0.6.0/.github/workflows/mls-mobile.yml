# Конвейер мобильного ядра MLS. Запускается вручную или при изменении папки mobile-mls.
name: mls-mobile

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-mls/**"
      - ".github/workflows/mls-mobile.yml"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - name: Тесты моста на Linux
        working-directory: mobile-mls/mls-bridge
        run: cargo test --locked

  android:
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Установка cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Сборка для Android
        run: ./mobile-mls/scripts/build-android.sh "$RUNNER_TEMP/jniLibs"
      - uses: actions/upload-artifact@v4
        with:
          name: mls-android
          path: ${{ runner.temp }}/jniLibs

  ios:
    needs: host-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Сборка XCFramework
        run: ./mobile-mls/scripts/build-ios.sh "$RUNNER_TEMP/MlsBridge.xcframework"
      - uses: actions/upload-artifact@v4
        with:
          name: mls-ios
          path: ${{ runner.temp }}/MlsBridge.xcframework
