[package]
name = "mls-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
openmls = "0.8"
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
openmls_traits = "0.5"
serde_json = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
openmls_sqlite_storage = "=0.2.0"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = "1"
aes-gcm = "0.10.3"
sha2 = "0.10.9"
zeroize = "1.9.1"
