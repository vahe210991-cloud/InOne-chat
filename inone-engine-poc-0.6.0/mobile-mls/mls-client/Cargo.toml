[package]
name = "mls-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
openmls = { version = "=0.9.2", default-features = false, features = ["openmls_rust_crypto", "0-8-1-storage-format"] }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
serde_json = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
openmls_sqlite_storage = { path = "../../../inone-development-archive-0.6.0/engine/mobile-mls/vendor/openmls_sqlite_storage" }
rusqlite = { version = "=0.42.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = "1"
zeroize = "1.9.1"
url = "2.5.9"

[patch.crates-io]
openmls_rust_crypto = { path = "../../../inone-development-archive-0.6.0/engine/mobile-mls/vendor/openmls_rust_crypto" }
openmls_basic_credential = { path = "../../../inone-development-archive-0.6.0/engine/mobile-mls/vendor/openmls_basic_credential" }
openmls_libcrux_crypto = { path = "../../../inone-development-archive-0.6.0/engine/mobile-mls/vendor/openmls_libcrux_crypto" }
openmls_sqlite_storage = { path = "../../../inone-development-archive-0.6.0/engine/mobile-mls/vendor/openmls_sqlite_storage" }
refinery-core = { path = "../../../inone-development-archive-0.6.0/engine/mobile-mls/vendor/refinery-core" }
